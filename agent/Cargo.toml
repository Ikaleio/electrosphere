[package]
name = "electrosphere-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
libc = "0.2.177"
globset = "0.4"
ignore = "0.4"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "term", "user"] }
pcre2-sys = "0.2.10"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signal-hook = "0.3.18"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
